<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Bill Simpel</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f2f4f8; margin: 0; padding: 20px; }
        .container { max-width: 420px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #2d3436; margin-top: 0; font-size: 22px; margin-bottom: 20px;}
        
        /* Area Input Item */
        .input-row { display: flex; align-items: center; margin-bottom: 12px; gap: 10px; }
        .item-number { width: 25px; font-weight: 600; color: #b2bec3; flex-shrink: 0; font-size: 14px; }
        .price-input { 
            flex-grow: 1; padding: 14px; border: 1px solid #dfe6e9; border-radius: 10px; font-size: 16px; 
            background-color: #fff; transition: 0.2s; 
        }
        .price-input:focus { outline: none; border-color: #0984e3; background-color: #f1f8ff; }
        
        /* Hasil Per Item */
        .result-span { 
            font-weight: 700; color: #00b894; min-width: 100px; text-align: right; 
            font-size: 16px; display: none; 
        }

        .btn-add { background: #dfe6e9; color: #636e72; border: none; width: 100%; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; margin-bottom: 20px; }
        .btn-add:hover { background: #b2bec3; color: white; }

        /* Area Ringkasan & Total Akhir */
        .summary-box { background-color: #f1f2f6; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: #636e72; }
        .total-input-label { font-weight: bold; color: #2d3436; margin-bottom: 8px; display: block; font-size: 15px;}
        
        #finalBillInput { 
            width: 100%; box-sizing: border-box; border: 2px solid #0984e3; background-color: #fff; 
            color: #2d3436; font-weight: bold; font-size: 18px;
        }

        .btn-calc { background: #0984e3; color: white; border: none; width: 100%; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 10px rgba(9, 132, 227, 0.3); transition: transform 0.1s; }
        .btn-calc:active { transform: scale(0.98); }
        .btn-reset { background: none; border: none; color: #d63031; width: 100%; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>🧾 Split Bill Struk</h2>

    <div id="inputContainer"></div>

    <button class="btn-add" onclick="addInputRow()">+ Tambah Item Menu</button>

    <div class="summary-box">
        <div class="summary-row">
            <span>Total Harga Menu (Subtotal):</span>
            <span id="displaySubtotal" style="font-weight:bold;">Rp0</span>
        </div>
        
        <hr style="border: 0; border-top: 1px dashed #ccc; margin: 15px 0;">

        <label class="total-input-label">Total Bayar Akhir (Lihat Struk):</label>
        <input type="number" id="finalBillInput" class="price-input" placeholder="Contoh: 65000">
    </div>

    <button class="btn-calc" onclick="calculate()">HITUNG PEMBAGIAN</button>
    <button class="btn-reset" onclick="resetAll()">Reset</button>
</div>

<script>
    window.onload = function() {
        // Mulai dengan 3 baris input
        addInputRow(); addInputRow(); addInputRow();
    };

    function addInputRow() {
        const container = document.getElementById('inputContainer');
        const index = container.children.length + 1;
        const div = document.createElement('div');
        div.className = 'input-row';
        div.innerHTML = `
            <div class="item-number">#${index}</div>
            <input type="number" class="price-input item-price" placeholder="Harga menu" oninput="updateSubtotal()" onkeydown="handleEnter(event)">
            <span class="result-span">Rp0</span>
        `;
        container.appendChild(div);
    }

    function handleEnter(e) {
        if(e.key === "Enter") {
            addInputRow();
            setTimeout(() => {
                const inputs = document.querySelectorAll('.item-price');
                inputs[inputs.length - 1].focus();
            }, 50);
        }
    }

    // Fungsi update Subtotal realtime saat mengetik harga
    function updateSubtotal() {
        const inputs = document.querySelectorAll('.item-price');
        let subtotal = 0;
        inputs.forEach(inp => {
            let val = parseFloat(inp.value);
            if(!isNaN(val)) subtotal += val;
        });
        document.getElementById('displaySubtotal').innerText = "Rp" + subtotal.toLocaleString();
        return subtotal;
    }

    function calculate() {
        // 1. Ambil Subtotal (Total Harga Asli Menu)
        const subtotal = updateSubtotal();
        const finalBill = parseFloat(document.getElementById('finalBillInput').value);

        if (subtotal === 0 || isNaN(finalBill)) {
            alert("Mohon isi harga menu dan total bayar akhir dari struk!");
            return;
        }

        // 2. Hitung Rasio (Magic Formula)
        // Rasio = Total Akhir / Total Asli
        const ratio = finalBill / subtotal;

        // 3. Terapkan Rasio ke Setiap Item
        const inputs = document.querySelectorAll('.item-price');
        const spans = document.querySelectorAll('.result-span');

        inputs.forEach((inp, idx) => {
            let originalPrice = parseFloat(inp.value);
            if (isNaN(originalPrice)) originalPrice = 0;

            if (originalPrice > 0) {
                // Rumus: Harga Asli x Rasio
                const finalPrice = originalPrice * ratio;
                
                // Pembulatan ke ratusan terdekat (biar gampang transfer)
                const rounded = Math.round(finalPrice / 100) * 100;

                const span = spans[idx];
                span.style.display = 'block';
                span.innerText = "Rp" + rounded.toLocaleString();
            } else {
                spans[idx].style.display = 'none';
            }
        });
    }

    function resetAll() {
        document.getElementById('inputContainer').innerHTML = "";
        document.getElementById('finalBillInput').value = "";
        document.getElementById('displaySubtotal').innerText = "Rp0";
        addInputRow(); addInputRow(); addInputRow();
    }
</script>

</body>
</html>
